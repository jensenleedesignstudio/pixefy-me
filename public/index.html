<!doctype html> 

<html lang = "en">

    <head>
        <meta charset = "utf-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1">
        <title>pixefy me</title>

        <link rel="stylesheet" href="./vendor/liquid-glass-0.3.0/liquid-glass.css">
        <link rel = "stylesheet" href = "styles.css">
        <link rel="stylesheet" href="./model-reveal.css">
        <link rel = "stylesheet"
            href = "https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block"
        >

        <script type="module">
            import { injectLiquidGlassFilter } from "./vendor/liquid-glass-0.3.0/inject-filter.js";

            // Share one still lens across the controls, even while the ripples move behind them.
            const lens = injectLiquidGlassFilter({ scale: 8, animate: false });
            document.documentElement.style.setProperty("--lg-filter", `url("#${lens.id}")`);
        </script>
        <script type = "module"
            src = "https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js">
        </script>
    </head>

    <body>
        <div id="generation-background" aria-hidden="true">
            <div class="shader-host"></div>
        </div>
        <div id="generation-status" role="status" aria-live="polite" hidden></div>
        <h1>pixefy me</h1>

        <main class = "workspace">
        
        <section 
            id = "canvas-panel"
            class = "drawing-panel is-active"
            data-view = "canvas"
        >
            <button type="button" class="thumbnail-select" aria-label="Open canvas in main panel" title="Open canvas" hidden></button>




        <input
            type = "file"
            id = "photo-upload"
            accept = "image/png,image/jpeg,image/webp"
            hidden>

        <div class = "canvas-layout">
            <div class="drawing-toolbar liquid-glass" role="group" aria-label="Canvas controls">
                <button id="toolbar-toggle" type="button" aria-expanded="true"
                    aria-controls="toolbar-drawer" aria-label="Collapse canvas controls"
                    title="Collapse canvas controls">
                    <span aria-hidden="true">&hellip;</span>
                </button>
                <div id="toolbar-drawer" class="toolbar-drawer">
                    <div class="toolbar-items">

            <div class = "tool-group" role = "group" aria-label = "brush settings">
                <div class = "color-control">
                    <input type = "color" id = "brush-color" value = "#000000" aria-label = "Brush colour" title = "Brush colour">
                </div>
                <div class = "size-control">
                    <input type = "range" id = "brush-size" min = "1" max = "40" value = "6" aria-label = "Brush size" title = "Brush size">
                    <output id = "brush-size-value" for = "brush-size">6 px</output>
                </div>
                <button class="icon-button" id="pencil" type="button" aria-label="Pencil" title="Pencil" aria-pressed="true">
                    <span class="material-symbols-outlined" aria-hidden="true">edit</span>
                </button>
                <button class = "icon-button" id = "eraser" type = "button" aria-label = "eraser" title = "eraser" aria-pressed = "false">
                    <span class = "material-symbols-outlined" aria-hidden = "true">ink_eraser</span>
                </button>
            </div>
            <div class = "tool-group" role = "group" aria-label = "Canvas history">
                <button class = "icon-button" id = "undo" type = "button" aria-label = "undo" title = "undo" disabled>
                    <span class = "material-symbols-outlined" aria-hidden = "true">undo</span>
                </button>
                <button class="icon-button" id="redo" type="button" aria-label="Redo" title="Redo" disabled>
                    <span class="material-symbols-outlined" aria-hidden="true">redo</span>
                </button>
            </div>
            <div class="drawing-actions" role="group" aria-label="Canvas actions">
                <button class = "icon-button" id = "clear" type = "button" aria-label = "clear canvas" title = "clear canvas">
                    <span class = "material-symbols-outlined" aria-hidden = "true">delete</span>
                </button>
                <button id = "generate" type = "button" title="Generate artwork">
                    <span class = "material-symbols-outlined" aria-hidden = "true">image</span>
                    <span class = "button-label">generate art</span>
                </button>
                <button id = "generate-3d" type = "button" title="Generate 3D model" disabled>
                    <span class = "material-symbols-outlined" aria-hidden = "true">view_in_ar</span>
                    <span class = "button-label">generate 3d</span>
                </button>
<button
                type = "button"
                class = "panel-select"
                data-target = "canvas"
                aria-label = "show canvas in main panel"
                title = "show canvas"
            >
                <span class = "material-symbols-outlined" aria-hidden = "true">
                    open_in_full
                </span>
            </button>
                <button class = "icon-button" id = "upload-button" type = "button" aria-label = "upload image" title = "upload image">
                    <span class = "material-symbols-outlined" aria-hidden = "true">upload</span>
                </button>
                <button class = "icon-button" id = "save-sketch" type = "button" aria-label = "save sketch" title = "save sketch">
                    <span class = "material-symbols-outlined" aria-hidden = "true">download</span>
                </button>
            </div>

                    </div>
                </div>
            </div>
            <div class="canvas-surface liquid-glass reveal-line" style="animation-delay: 0.5s;">
                <canvas id = "drawing" width = "600" height = "350">
                </canvas>
            </div>



            <div class="instruction-column liquid-glass reveal-line" style="animation-delay: 0.65s;">
                <textarea
                    id = "art-instructions"
                    aria-label="Character instructions"
                    rows = "3"
                    placeholder = "make this penguin look a little kawaii..."
                ></textarea>
            </div>
        </div>

        </section>
        <section 
            id = "art-panel"
            class = "preview-panel"
            data-view = "art"
        >
            <button type="button" class="thumbnail-select" aria-label="Open artwork in main panel" title="Open artwork"></button>
            <div class="reveal-line" style="animation-delay: 0.8s;">

        <div class = "panel-header">
            <h2>artwork</h2>

            <button 
                type = "button" 
                class = "panel-select liquid-glass"
                data-target = "art"
                aria-label = "show art preview in main panel"
                title = "show art preview"
            >    
                <span class = "material-symbols-outlined" aria-hidden = "true">
                    open_in_full
                </span>
            </button>

        </div>

            <div class="preview-surface liquid-glass">
                <img id = "preview" src = "kawaiipenguin2.png" alt = "kawaiipenguin!" width = "400">
            </div>

            <a id = "download-art" download = "pixel-art.png" hidden>download art</a>
                    </div>
        </section>

        <section
            id = "model-panel"
            class = "preview-panel"
            data-view = "model"
        >
            <button type="button" class="thumbnail-select" aria-label="Open 3D model in main panel" title="Open 3D model"></button>
            <div class="reveal-line" style="animation-delay: 0.95s;">

        <div class = "panel-header">
            <h2>3d preview</h2>

            <button 
                type = "button" 
                class = "panel-select liquid-glass"
                data-target = "model"
                aria-label = "show 3d in main panel"
                title = "show 3d"
            >
                <span class = "material-symbols-outlined" aria-hidden = "true">
                    open_in_full
                </span>
            </button>

        </div>

            <div class="preview-surface liquid-glass">
                <model-viewer
                id = "model-preview"
                src = "kawaiipenguin.glb"
                poster = "kawaiipenguin2.png"
                alt = "3d model of your character"
                camera-controls
                auto-rotate
                rotation-per-second = "20deg">
            </model-viewer>
            </div>

                    </div>
        </section>
        </main>

        <button id="test-generation-effect" type="button"
            title="Preview loading and success animations without making API calls">
            test generation effect (no credits)
        </button>

        <script type="module">
            import { beginGenerationEffect } from "./generation-effects.js";
            import { beginModelRequest, cancelModelReveal } from "./model-reveal.js";

            // Temporary visual test: uses the same effects, but never sends a request.
            const testEffectButton = document.getElementById("test-generation-effect");
            testEffectButton.addEventListener("click", function () {
                testEffectButton.disabled = true;
                testEffectButton.textContent = "testing generation effect…";
                testEffectButton.setAttribute("aria-busy", "true");
                const finishArt = beginGenerationEffect("art");
                const finishModel = beginGenerationEffect("model");
                setTimeout(() => finishArt(true), 3000);
                setTimeout(function () {
                    finishModel(true);
                    testEffectButton.disabled = false;
                    testEffectButton.textContent = "test generation effect (no credits)";
                    testEffectButton.removeAttribute("aria-busy");
                }, 6000);
            });

            let generatedImage = null;

            const panels = document.querySelectorAll(".workspace > section");
            const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
            const panelAnimations = new Map();
            const revealElements = document.querySelectorAll(".reveal-line");

            function finishReveal(element) {
                element.classList.add("reveal-complete");
            }

            function finishEntranceAnimations() {
                revealElements.forEach(finishReveal);
            }

            revealElements.forEach(function (element) {
                function onRevealFinished(event) {
                    if (event.target === element && event.animationName === "reveal") {
                        finishReveal(element);
                    }
                }
                element.addEventListener("animationend", onRevealFinished);
                element.addEventListener("animationcancel", onRevealFinished);
                // Focusing early reveals the content permanently, rather than restarting on blur.
                element.addEventListener("focusin", function () {
                    finishReveal(element);
                });
            });
            if (reducedMotion.matches) finishEntranceAnimations();


            function cancelPanelAnimations() {
                panelAnimations.forEach(function (animation) {
                    animation.cancel();
                });
                panelAnimations.clear();
            }

            function syncPreviewSizes() {
                const workspace = document.querySelector(".workspace");
                const canvasPanel = document.getElementById("canvas-panel");
                const instructions = document.getElementById("art-instructions");
                const column = instructions.closest(".instruction-column");
                const aligned = canvasPanel.classList.contains("is-active")
                    && window.innerWidth > 960 && !document.fullscreenElement
                    && instructions.offsetHeight >= 240;
                workspace.classList.toggle("previews-aligned", aligned);
                if (aligned) {
                    const gap = parseFloat(getComputedStyle(workspace).rowGap) || 0;
                    workspace.style.setProperty("--preview-card-height",
                        `${(instructions.offsetHeight - gap) / 2}px`);
                    workspace.style.setProperty("--preview-top-offset", `${column.offsetTop}px`);
                }
            }

            function setActivePanel(view) {
                const selectedPanel = Array.from(panels).find(panel => panel.dataset.view === view);
                if (!selectedPanel || selectedPanel.classList.contains("is-active")) return;
                if (view !== "model") cancelModelReveal();

                // Entering the workspace ends its one-time intro, even on an early click.
                finishEntranceAnimations();

                // First: capture visible positions, including any unfinished animation.
                const first = Array.from(panels, panel => panel.getBoundingClientRect());
                cancelPanelAnimations();

                // Last: let the existing grid and contextual controls take their new layout.
                panels.forEach(function (panel) {
                    const isSelected = panel.dataset.view === view;
                    panel.classList.toggle("is-active", isSelected);
                });
                updatePanelButtons();
                syncPreviewSizes();

                // An old fullscreen panel would cover the result even after the grid switches.
                const fullscreenPanel = document.fullscreenElement;
                if (fullscreenPanel?.matches(".workspace > section") && fullscreenPanel !== selectedPanel) {
                    document.exitFullscreen().catch(error => console.warn("Could not leave fullscreen.", error));
                    return;
                }
                if (reducedMotion.matches || !selectedPanel.animate) return;
                const last = Array.from(panels, panel => panel.getBoundingClientRect());

                panels.forEach(function (panel, index) {
                    const before = first[index];
                    const after = last[index];
                    if (!before.width || !before.height || !after.width || !after.height) return;
                    const x = before.left - after.left;
                    const y = before.top - after.top;
                    const scaleX = before.width / after.width;
                    const scaleY = before.height / after.height;
                    if (x === 0 && y === 0 && scaleX === 1 && scaleY === 1) return;

                    // Invert, then Play: visually return to the old box and glide to the new one.
                    const animation = panel.animate([
                        { transform: `translate(${x}px, ${y}px) scale(${scaleX}, ${scaleY})` },
                        { transform: "none" }
                    ], {
                        duration: 350,
                        easing: "cubic-bezier(0.22, 1, 0.36, 1)"
                    });
                    panelAnimations.set(panel, animation);
                    animation.onfinish = function () {
                        // An older animation must never clean up a newer rapid-click animation.
                        if (panelAnimations.get(panel) === animation) {
                            panelAnimations.delete(panel);
                        }
                    };
                });
            }

            // A changed viewport or motion preference should immediately show the final layout.
            window.addEventListener("resize", cancelPanelAnimations);
            reducedMotion.addEventListener("change", function () {
                if (reducedMotion.matches) {
                    cancelPanelAnimations();
                    finishEntranceAnimations();
                }
            });

            const panelButtons = document.querySelectorAll(".panel-select");

            function updatePanelButtons() {
                panels.forEach(function (panel) {
                    const button = panel.querySelector(".panel-select");
                    const name = { canvas: "canvas", art: "artwork", model: "3D model" }[panel.dataset.view];
                    const isActive = panel.classList.contains("is-active");
                    const thumbnail = panel.querySelector(".thumbnail-select");
                    button.hidden = !isActive;
                    thumbnail.hidden = isActive;

                    // The thumbnail button handles interaction until this view is active.
                    const content = panel.querySelector("model-viewer");
                    if (content) content.inert = !isActive;
                    const download = panel.querySelector("#download-art");
                    if (download) download.inert = !isActive;

                    const isFullscreen = document.fullscreenElement === panel;
                    const label = isFullscreen ? "exit fullscreen"
                        : panel.classList.contains("is-active") ? `view ${name} fullscreen`
                        : `show ${name} in main panel`;
                    button.setAttribute("aria-label", label);
                    button.title = label;
                    button.querySelector(".material-symbols-outlined").textContent =
                        isFullscreen ? "close_fullscreen" : "open_in_full";
                });
            }

            document.addEventListener("fullscreenchange", function () {
                cancelPanelAnimations();
                updatePanelButtons();
                syncPreviewSizes();
            });
            updatePanelButtons();
            syncPreviewSizes();
            window.addEventListener("resize", syncPreviewSizes);
            if (window.ResizeObserver) {
                const previewSizeObserver = new ResizeObserver(syncPreviewSizes);
                previewSizeObserver.observe(document.getElementById("art-instructions"));
                previewSizeObserver.observe(document.getElementById("canvas-panel"));
            }

            panels.forEach(function (panel) {
                panel.querySelector(".thumbnail-select").addEventListener("click", function () {
                    setActivePanel(panel.dataset.view);
                    // Move focus to a visible control after hiding the thumbnail button.
                    panel.querySelector(".panel-select").focus({ preventScroll: true });
                });
            });

            panelButtons.forEach(function (button) {
                button.addEventListener("click", async function () {
                    const panel = button.closest("section");
                    if (!panel.classList.contains("is-active")) return;

                    // Finish any panel swap before the browser takes over fullscreen.
                    cancelPanelAnimations();
                    try {
                        if (document.fullscreenElement === panel) {
                            await document.exitFullscreen();
                        } else if (panel.requestFullscreen) {
                            await panel.requestFullscreen();
                        } else {
                            alert("Fullscreen is not supported in this browser.");
                        }
                    } catch (error) {
                        alert("Could not change fullscreen. Please try again.");
                    }
                });
            });

            const canvas = document.getElementById("drawing");
            const ctx = canvas.getContext("2d");
            const colorPicker = document.getElementById("brush-color");
            const sizePicker = document.getElementById("brush-size");
            const sizeValue = document.getElementById("brush-size-value");
            const eraserToggle = document.getElementById("eraser");
            const uploadButton = document.getElementById("upload-button");
            const photoUpload = document.getElementById("photo-upload");
            const undoHistory = [];

            const toolbar = document.querySelector(".drawing-toolbar");
            const toolbarToggle = document.getElementById("toolbar-toggle");
            const toolbarDrawer = document.getElementById("toolbar-drawer");

            function setToolbarExpanded(expanded) {
                toolbar.classList.toggle("is-collapsed", !expanded);
                toolbarToggle.setAttribute("aria-expanded", String(expanded));
                const label = expanded ? "Collapse canvas controls" : "Expand canvas controls";
                toolbarToggle.setAttribute("aria-label", label);
                toolbarToggle.title = label;
                // Keep collapsing controls out of keyboard and screen-reader navigation.
                toolbarDrawer.inert = !expanded;
                toolbarDrawer.setAttribute("aria-hidden", String(!expanded));
            }

            toolbarToggle.addEventListener("click", function () {
                setToolbarExpanded(toolbarToggle.getAttribute("aria-expanded") !== "true");
            });

            toolbar.addEventListener("keydown", function (event) {
                // Preserve Escape's native fullscreen behaviour.
                if (event.key === "Escape" && !document.fullscreenElement) {
                    toolbarToggle.focus();
                    setToolbarExpanded(false);
                }
            });


            sizePicker.addEventListener("input", function () {
                sizeValue.value = sizePicker.value + " px";
            });

            const pencil = document.getElementById("pencil");
            function selectEraser(active) {
                eraserToggle.setAttribute("aria-pressed", String(active));
                pencil.setAttribute("aria-pressed", String(!active));
            }
            pencil.addEventListener("click", () => selectEraser(false));
            eraserToggle.addEventListener("click", () => {
                selectEraser(eraserToggle.getAttribute("aria-pressed") !== "true");
            });

            function getCanvasPoint(event) {
                // Convert the visible content box (excluding its border) to canvas pixels.
                // Its bounding box includes the panel's in-flight FLIP scale as well.
                const rect = canvas.getBoundingClientRect();
                const scaleX = rect.width / canvas.offsetWidth;
                const scaleY = rect.height / canvas.offsetHeight;
                const x = ((event.clientX - rect.left) / scaleX - canvas.clientLeft)
                    * canvas.width / canvas.clientWidth;
                const y = ((event.clientY - rect.top) / scaleY - canvas.clientTop)
                    * canvas.height / canvas.clientHeight;
                return { x, y };
            }

            let drawing = false

            canvas.addEventListener("pointerdown", function (event) {

                recordEdit();

                drawing = true
                canvas.setPointerCapture(event.pointerId);

                const { x, y } = getCanvasPoint(event);

                ctx.strokeStyle = colorPicker.value;
                ctx.lineWidth = Number(sizePicker.value);
                ctx.globalCompositeOperation = eraserToggle.getAttribute("aria-pressed") === "true"
                    ? "destination-out"
                    : "source-over";

                ctx.beginPath();
                ctx.moveTo(x, y);
            });

            canvas.addEventListener("pointerup", function () {
                drawing = false;
            });

            canvas.addEventListener("pointermove", function (event) { 
                if (!drawing) return; 

                const { x, y } = getCanvasPoint(event);
                ctx.lineTo(x, y);
                ctx.stroke();
            });
            

            const clearButton = document.getElementById("clear");

            clearButton.addEventListener("click", function () {
                recordEdit();

                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });

            const undoButton = document.getElementById("undo");
            const redoButton = document.getElementById("redo");
            const redoHistory = [];

            function snapshot() {
                return ctx.getImageData(0, 0, canvas.width, canvas.height);
            }

            function updateHistoryButtons() {
                undoButton.disabled = undoHistory.length === 0;
                redoButton.disabled = redoHistory.length === 0;
            }

            function recordEdit() {
                undoHistory.push(snapshot());
                redoHistory.length = 0;
                updateHistoryButtons();
            }

            function restoreEdit(from, to) {
                if (!from.length) return;
                to.push(snapshot());
                ctx.putImageData(from.pop(), 0, 0);
                updateHistoryButtons();
            }

            undoButton.addEventListener("click", () => restoreEdit(undoHistory, redoHistory));
            redoButton.addEventListener("click", () => restoreEdit(redoHistory, undoHistory));

            const saveButton = document.getElementById("save-sketch");

            saveButton.addEventListener("click", function () {
                const link = document.createElement("a");
                link.href = canvas.toDataURL("image/png");
                link.download = "sketch.png";
                link.click();
            });

            const generateButton = document.getElementById("generate");
            const generateLabel = generateButton.querySelector(".button-label");

            generateButton.addEventListener("click", function () {
                const finishEffect = beginGenerationEffect("art");
                generateButton.disabled = true; 
                generateLabel.textContent = "Generating...";
                generateButton.setAttribute("aria-busy", "true");

                canvas.toBlob(function (sketch) {
                    if (!sketch) {
                        finishEffect(false);
                        generateButton.disabled = false;
                        generateLabel.textContent = "Generate art";
                        generateButton.removeAttribute("aria-busy");
                        alert("Could not export the drawing. Please try again.");
                        return;
                    }
                    const form = new FormData();
                    form.append("sketch", sketch, "sketch.png");
                    const instructions = document.getElementById("art-instructions").value;
                    form.append("instructions", instructions);

                    fetch("/generate", { method: "POST", body: form })
                        .then(async response => {
                            if (!response.ok) {
                                const message = await response.text();
                                throw new Error(message);
                            }

                            return response.blob();
                        })
                        .then(image => {
                            generatedImage = image;
                            generate3dButton.disabled = modelRequestPending;
                            const preview = document.getElementById("preview");
                            preview.src = URL.createObjectURL(image);
                            setActivePanel("art");

                            const downloadLink = document.getElementById("download-art");
                            downloadLink.href = preview.src;
                            downloadLink.hidden = false;
                            finishEffect(true);
                        })
                        .catch(error => {
                            alert(error.message);
                        })
                        .finally(() => {
                            generateButton.disabled = false; 
                            generateLabel.textContent = "Generate art";
                            generateButton.removeAttribute("aria-busy");
                            finishEffect(false);
                        });
                }, "image/png");
            });

            const generate3dButton = document.getElementById("generate-3d");
            const generate3dLabel = generate3dButton.querySelector(".button-label");
            let modelRequestPending = false;

            generate3dButton.addEventListener("click", function () {
                if (!generatedImage || modelRequestPending) return;
                modelRequestPending = true;
                setActivePanel("model");
                const reveal = beginModelRequest(document.getElementById("preview").src);
                const finishEffect = beginGenerationEffect("model");

                generate3dButton.disabled = true;
                generate3dLabel.textContent = "Generating 3D...";
                generate3dButton.setAttribute("aria-busy", "true");

                const form = new FormData();
                form.append("image", generatedImage, "pixel-art.png");

                fetch("/generate-3d", {
                    method: "POST",
                    body: form
                })
                    .then(async response => {
                        if (!response.ok) {
                            throw new Error(await response.text());
                        }

                        return response.blob();
                    })
                    .then(model => {
                        reveal.show(model);
                        finishEffect(true);
                    })
                    .catch(error => {
                        reveal.fail();
                        alert(error.message);
                    })
                    .finally(() => {
                        modelRequestPending = false;
                        generate3dButton.disabled = false;
                        generate3dLabel.textContent = "Generate 3D";
                        generate3dButton.removeAttribute("aria-busy");
                        finishEffect(false);
                    });
            });

                    uploadButton.addEventListener("click", function () {
                photoUpload.click();
            });

            photoUpload.addEventListener("change", async function () {
                const file = photoUpload.files[0];
                if (!file) return;

                try {
                    const photo = await createImageBitmap(file);

                    recordEdit();

                    const scale = Math.min(
                        canvas.width / photo.width,
                        canvas.height / photo.height
                    );

                    const width = photo.width * scale;
                    const height = photo.height * scale;
                    const x = (canvas.width - width) / 2;
                    const y = (canvas.height - height) / 2;

                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.globalCompositeOperation = "source-over";
                    ctx.drawImage(photo, x, y, width, height);

                    photo.close();
                } catch (error) {
                    alert("Could not open this image. Try a PNG or JPEG.");
                }

                photoUpload.value = "";
            });

            document.addEventListener("click", function (event) {
                const button = event.target.closest("button");

                if (
                    !button ||
                    button.classList.contains("thumbnail-select") ||
                    window.matchMedia("(prefers-reduced-motion: reduce)").matches
                ) return;

                button.classList.remove("button-bounce");
                void button.offsetWidth;
                button.classList.add("button-bounce");
            });
        
        </script>

    </body>

</html>
