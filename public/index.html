<!doctype html> 

<html lang = "en">

    <head>
        <meta charset = "utf-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1">
        <title>pixefy me</title>

        <link rel = "stylesheet" href = "styles.css">
    </head>

    <body>
        <h1>pixefy me</h1>

        <main class = "workspace">
            <section class  = "drawing-panel">

        <h2>your canvas</h2>

        <canvas id = "drawing" width = "600" height = "350">
        </canvas>

        <div class = "drawing-actions">
            <button id = "clear" type = "button">clear</button>
            <button id = "save-sketch" type = "button">save</button>
            <button id = "generate" type = "button">generate</button>
            <button id = "generate-3d" type = "button" disabled>generate 3d</button>
        </div>

        </section>
        <section class = "preview-panel">

        <h2>pixel art preview</h2>
        <img id = "preview" src = "pixel-cat.png" alt = "pixelated version of cat" width = "400">

        <a id = "download-art" download = "pixel-art.png" hidden>download pixel art</a>
        
        </section>
        </main>

        <script> 
            let generatedImage = null;

            const canvas = document.getElementById("drawing");
            const ctx = canvas.getContext("2d");

            function getCanvasPoint(event) {
                const x = event.offsetX * (canvas.width / canvas.clientWidth);
                const y = event.offsetY * (canvas.height / canvas.clientHeight);
                return { x, y };
}

            let drawing = false

            canvas.addEventListener("pointerdown", function (event) {
                drawing = true
                canvas.setPointerCapture(event.pointerId);

                const x = event.offsetX;
                const y = event.offsetY;

                ctx.strokeStyle = "orange";
                ctx.lineWidth = 6;

                ctx.beginPath();
                ctx.moveTo(x, y);
            });

            canvas.addEventListener("pointerup", function () {
                drawing = false;
            });

            canvas.addEventListener("pointermove", function (event) { 
                if (!drawing) return; 

                ctx.lineTo(event.offsetX, event.offsetY);
                ctx.stroke();
            });
            

            const clearButton = document.getElementById("clear");

            clearButton.addEventListener("click", function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });

            const saveButton = document.getElementById("save-sketch");

            saveButton.addEventListener("click", function () {
                const link = document.createElement("a");
                link.href = canvas.toDataURL("image/png");
                link.download = "sketch.png";
                link.click();
            });

            const generateButton = document.getElementById("generate");

            generateButton.addEventListener("click", function () {
                generateButton.disabled = true; 
                generateButton.textContent = "generating...";

                canvas.toBlob(function (sketch) {
                    const form = new FormData();
                    form.append("sketch", sketch, "sketch.png");

                    fetch("/generate", { method: "POST", body: form })
                        .then(async response => {
                            if (!response.ok) {
                                const message = await response.text();
                                throw new Error(message);
                            }

                            return response.blob();
                        })
                        .then(image => {
                            generatedImage = image;
                            generate3dButton.disabled = false;
                            const preview = document.getElementById("preview");
                            preview.src = URL.createObjectURL(image);

                            const downloadLink = document.getElementById("download-art");
                            downloadLink.href = preview.src;
                            downloadLink.hidden = false;
                        })
                        .catch(error => {
                            alert(error.message);
                        })
                        .finally(() => {
                            generateButton.disabled = false; 
                            generateButton.textContent = "generate"; 
                        });
                }, "image/png");
            });

            const generate3dButton = document.getElementById("generate-3d");

            generate3dButton.addEventListener("click", function () {
                if (!generatedImage) return;

                const form = new FormData();
                form.append("image", generatedImage, "pixel-art.png");

                fetch("/generate-3d", {
                    method: "POST",
                    body: form
                })
                    .then(async response => {
                        const message = await response.text();

                        if (!response.ok) {
                            throw new Error(message);
                        }

                        console.log(message);
                    })
                    .catch(error => {
                        alert(error.message);
                    });
                            });

        </script>

    </body>

</html>
