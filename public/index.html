<!doctype html> 

<html lang = "en">

    <head>
        <meta charset = "utf-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1">
        <title>pixefy me</title>

        <link rel = "stylesheet" href = "styles.css">
        <link rel = "stylesheet"
            href = "https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block"
        >

        <script type="module"
            src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js">
        </script>
    </head>

    <body>
        <h1>pixefy me</h1>

        <main class = "workspace">
        
        <section 
            id = "canvas-panel"
            class = "drawing-panel is-active"
            data-view = "canvas"
        >

        <div class = "panel-header">
            <h2>your canvas</h2>

            <button 
                type = "button" 
                class = "panel-select" 
                data-target = "canvas"
                aria-label = "show canvas in main panel"
                title = "show canvas"
            >
                <span class = "material-symbols-outlined" aria-hidden = "true">
                    open_in_full
                </span>
            </button>
        </div>

        <div class = "drawing-toolbar" role = "group" aria-label = "drawing tools">
            <div class = "tool-group" role = "group" aria-label = "brush settings">
                <div class = "color-control">
                    <label for = "brush-color">colour</label>
                    <input type = "color" id = "brush-color" value = "#000000" title = "brush colour">
                </div>
                <div class = "size-control">
                    <label for = "brush-size">brush</label>
                    <input type = "range" id = "brush-size" min = "1" max = "40" value = "6">
                    <output id = "brush-size-value" for = "brush-size">6</output>
                </div>
                <button class = "icon-button" id = "eraser" type = "button" aria-label = "eraser" title = "eraser" aria-pressed = "false">
                    <span class = "material-symbols-outlined" aria-hidden = "true">ink_eraser</span>
                </button>
            </div>
            <div class = "tool-group" role = "group" aria-label = "canvas actions">
                <button class = "icon-button" id = "undo" type = "button" aria-label = "undo" title = "undo">
                    <span class = "material-symbols-outlined" aria-hidden = "true">undo</span>
                </button>
                <button class = "icon-button" id = "clear" type = "button" aria-label = "clear canvas" title = "clear canvas">
                    <span class = "material-symbols-outlined" aria-hidden = "true">delete</span>
                </button>
                <button class = "icon-button" id = "upload-button" type = "button" aria-label = "upload image" title = "upload image">
                    <span class = "material-symbols-outlined" aria-hidden = "true">upload</span>
                </button>
                <button class = "icon-button" id = "save-sketch" type = "button" aria-label = "save sketch" title = "save sketch">
                    <span class = "material-symbols-outlined" aria-hidden = "true">download</span>
                </button>
            </div>
        </div>
        <input
            type = "file"
            id = "photo-upload"
            accept = "image/png,image/jpeg,image/webp"
            hidden>

        <canvas id = "drawing" width = "600" height = "350">
        </canvas>

        <div class = "drawing-actions" role = "group" aria-label = "Generation actions">
            <button id = "generate" type = "button">
                <span class = "material-symbols-outlined" aria-hidden = "true">image</span>
                <span class = "button-label">Generate art</span>
            </button>
            <button id = "generate-3d" type = "button" disabled>
                <span class = "material-symbols-outlined" aria-hidden = "true">view_in_ar</span>
                <span class = "button-label">Generate 3D</span>
            </button>
        </div>

        <label for = "art-instructions">character instructions</label>
        <textarea 
            id = "art-instructions"
            rows = "3"
            placeholder = "make this penguin look a little kawaii..."
        ></textarea>

        </section>
        <section 
            id = "art-panel"
            class = "preview-panel"
            data-view = "art"
        >

        <div class = "panel-header">
            <h2>art preview</h2>

            <button 
                type = "button" 
                class = "panel-select" 
                data-target = "art"
                aria-label = "show art preview in main panel"
                title = "show art preview"
            >    
                <span class = "material-symbols-outlined" aria-hidden = "true">
                    open_in_full
                </span>
            </button>

        </div>

            <img id = "preview" src = "kawaiipenguin2.png" alt = "kawaiipenguin!" width = "400">

            <a id = "download-art" download = "pixel-art.png" hidden>download art</a>
        </section>

        <section
            id = "model-panel"
            class = "preview-panel"
            data-view = "model"
        >

        <div class = "panel-header">
            <h2>3d preview</h2>

            <button 
                type = "button" 
                class = "panel-select" 
                data-target = "model"
                aria-label = "show 3d in main panel"
                title = "show 3d"
            >
                <span class = "material-symbols-outlined" aria-hidden = "true">
                    open_in_full
                </span>
            </button>

        </div>

            <model-viewer
                id = "model-preview"
                src = "kawaiipenguin.glb"
                alt = "3d model of your character"
                camera-controls>
            </model-viewer>

        </section>
        </main>

        <script> 
            let generatedImage = null;

            const panels = document.querySelectorAll(".workspace > section");
            const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
            const panelAnimations = new Map();

            function cancelPanelAnimations() {
                panelAnimations.forEach(function (animation) {
                    animation.cancel();
                });
                panelAnimations.clear();
            }

            function setActivePanel(view) {
                const selectedPanel = Array.from(panels).find(panel => panel.dataset.view === view);
                if (!selectedPanel || selectedPanel.classList.contains("is-active")) return;

                // First: capture visible positions, including any unfinished animation.
                const first = Array.from(panels, panel => panel.getBoundingClientRect());
                cancelPanelAnimations();

                // Last: let the existing grid and contextual controls take their new layout.
                panels.forEach(function (panel) {
                    const isSelected = panel.dataset.view === view;
                    panel.classList.toggle("is-active", isSelected);
                });
                updatePanelButtons();

                if (reducedMotion.matches || !selectedPanel.animate) return;
                const last = Array.from(panels, panel => panel.getBoundingClientRect());

                panels.forEach(function (panel, index) {
                    const before = first[index];
                    const after = last[index];
                    if (!before.width || !before.height || !after.width || !after.height) return;
                    const x = before.left - after.left;
                    const y = before.top - after.top;
                    const scaleX = before.width / after.width;
                    const scaleY = before.height / after.height;
                    if (x === 0 && y === 0 && scaleX === 1 && scaleY === 1) return;

                    // Invert, then Play: visually return to the old box and glide to the new one.
                    const animation = panel.animate([
                        { transform: `translate(${x}px, ${y}px) scale(${scaleX}, ${scaleY})` },
                        { transform: "none" }
                    ], {
                        duration: 350,
                        easing: "cubic-bezier(0.22, 1, 0.36, 1)"
                    });
                    panelAnimations.set(panel, animation);
                    animation.onfinish = function () {
                        // An older animation must never clean up a newer rapid-click animation.
                        if (panelAnimations.get(panel) === animation) {
                            panelAnimations.delete(panel);
                        }
                    };
                });
            }

            // A changed viewport or motion preference should immediately show the final layout.
            window.addEventListener("resize", cancelPanelAnimations);
            reducedMotion.addEventListener("change", function () {
                if (reducedMotion.matches) cancelPanelAnimations();
            });

            const panelButtons = document.querySelectorAll(".panel-select");

            function updatePanelButtons() {
                panels.forEach(function (panel) {
                    const button = panel.querySelector(".panel-select");
                    const name = panel.querySelector("h2").textContent;
                    const isFullscreen = document.fullscreenElement === panel;
                    const label = isFullscreen ? "exit fullscreen"
                        : panel.classList.contains("is-active") ? `view ${name} fullscreen`
                        : `show ${name} in main panel`;
                    button.setAttribute("aria-label", label);
                    button.title = label;
                    button.querySelector(".material-symbols-outlined").textContent =
                        isFullscreen ? "close_fullscreen" : "open_in_full";
                });
            }

            document.addEventListener("fullscreenchange", function () {
                cancelPanelAnimations();
                updatePanelButtons();
            });
            updatePanelButtons();

            panelButtons.forEach(function (button) {
                button.addEventListener("click", async function () {
                    const panel = button.closest("section");
                    if (!panel.classList.contains("is-active")) {
                        setActivePanel(button.dataset.target);
                        return;
                    }

                    // Finish any panel swap before the browser takes over fullscreen.
                    cancelPanelAnimations();
                    try {
                        if (document.fullscreenElement === panel) {
                            await document.exitFullscreen();
                        } else if (panel.requestFullscreen) {
                            await panel.requestFullscreen();
                        } else {
                            alert("Fullscreen is not supported in this browser.");
                        }
                    } catch (error) {
                        alert("Could not change fullscreen. Please try again.");
                    }
                });
            });

            const canvas = document.getElementById("drawing");
            const ctx = canvas.getContext("2d");
            const colorPicker = document.getElementById("brush-color");
            const sizePicker = document.getElementById("brush-size");
            const sizeValue = document.getElementById("brush-size-value");
            const eraserToggle = document.getElementById("eraser");
            const uploadButton = document.getElementById("upload-button");
            const photoUpload = document.getElementById("photo-upload");
            const undoHistory = [];

            sizePicker.addEventListener("input", function () {
                sizeValue.value = sizePicker.value;
            });

            eraserToggle.addEventListener("click", function () {
                const isPressed = eraserToggle.getAttribute("aria-pressed") === "true";
                eraserToggle.setAttribute("aria-pressed", String(!isPressed));
            });

            function getCanvasPoint(event) {
                // Convert the visible content box (excluding its border) to canvas pixels.
                // Its bounding box includes the panel's in-flight FLIP scale as well.
                const rect = canvas.getBoundingClientRect();
                const scaleX = rect.width / canvas.offsetWidth;
                const scaleY = rect.height / canvas.offsetHeight;
                const x = ((event.clientX - rect.left) / scaleX - canvas.clientLeft)
                    * canvas.width / canvas.clientWidth;
                const y = ((event.clientY - rect.top) / scaleY - canvas.clientTop)
                    * canvas.height / canvas.clientHeight;
                return { x, y };
            }

            let drawing = false

            canvas.addEventListener("pointerdown", function (event) {

                undoHistory.push(
                    ctx.getImageData(0, 0, canvas.width, canvas.height)
                );

                drawing = true
                canvas.setPointerCapture(event.pointerId);

                const { x, y } = getCanvasPoint(event);

                ctx.strokeStyle = colorPicker.value;
                ctx.lineWidth = Number(sizePicker.value);
                ctx.globalCompositeOperation = eraserToggle.getAttribute("aria-pressed") === "true"
                    ? "destination-out"
                    : "source-over";

                ctx.beginPath();
                ctx.moveTo(x, y);
            });

            canvas.addEventListener("pointerup", function () {
                drawing = false;
            });

            canvas.addEventListener("pointermove", function (event) { 
                if (!drawing) return; 

                const { x, y } = getCanvasPoint(event);
                ctx.lineTo(x, y);
                ctx.stroke();
            });
            

            const clearButton = document.getElementById("clear");

            clearButton.addEventListener("click", function () {
                undoHistory.push(
                    ctx.getImageData(0, 0, canvas.width, canvas.height)
                );

                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });

            const undoButton = document.getElementById("undo");

            undoButton.addEventListener("click", function () {
                if (undoHistory.length === 0) return;

                const previousDrawing = undoHistory.pop();
                ctx.putImageData(previousDrawing, 0, 0);
            });

            const saveButton = document.getElementById("save-sketch");

            saveButton.addEventListener("click", function () {
                const link = document.createElement("a");
                link.href = canvas.toDataURL("image/png");
                link.download = "sketch.png";
                link.click();
            });

            const generateButton = document.getElementById("generate");
            const generateLabel = generateButton.querySelector(".button-label");

            generateButton.addEventListener("click", function () {
                generateButton.disabled = true; 
                generateLabel.textContent = "Generating...";
                generateButton.setAttribute("aria-busy", "true");

                canvas.toBlob(function (sketch) {
                    const form = new FormData();
                    form.append("sketch", sketch, "sketch.png");
                    const instructions = document.getElementById("art-instructions").value;
                    form.append("instructions", instructions);

                    fetch("/generate", { method: "POST", body: form })
                        .then(async response => {
                            if (!response.ok) {
                                const message = await response.text();
                                throw new Error(message);
                            }

                            return response.blob();
                        })
                        .then(image => {
                            generatedImage = image;
                            generate3dButton.disabled = false;
                            const preview = document.getElementById("preview");
                            preview.src = URL.createObjectURL(image);

                            const downloadLink = document.getElementById("download-art");
                            downloadLink.href = preview.src;
                            downloadLink.hidden = false;
                        })
                        .catch(error => {
                            alert(error.message);
                        })
                        .finally(() => {
                            generateButton.disabled = false; 
                            generateLabel.textContent = "Generate art";
                            generateButton.removeAttribute("aria-busy");
                        });
                }, "image/png");
            });

            const generate3dButton = document.getElementById("generate-3d");
            const generate3dLabel = generate3dButton.querySelector(".button-label");

            generate3dButton.addEventListener("click", function () {
                if (!generatedImage) return;

                generate3dButton.disabled = true;
                generate3dLabel.textContent = "Generating 3D...";
                generate3dButton.setAttribute("aria-busy", "true");

                const form = new FormData();
                form.append("image", generatedImage, "pixel-art.png");

                fetch("/generate-3d", {
                    method: "POST",
                    body: form
                })
                    .then(async response => {
                        if (!response.ok) {
                            throw new Error(await response.text());
                        }

                        return response.blob();
                    })
                    .then(model => {
                        const viewer = document.getElementById("model-preview");
                        viewer.src = URL.createObjectURL(model);
                    })
                    .catch(error => {
                        alert(error.message);
                    })
                    .finally(() => {
                        generate3dButton.disabled = false;
                        generate3dLabel.textContent = "Generate 3D";
                        generate3dButton.removeAttribute("aria-busy");
                    });
                            });

                    uploadButton.addEventListener("click", function () {
                photoUpload.click();
            });

            photoUpload.addEventListener("change", async function () {
                const file = photoUpload.files[0];
                if (!file) return;

                try {
                    const photo = await createImageBitmap(file);

                    undoHistory.push(
                        ctx.getImageData(0, 0, canvas.width, canvas.height)
                    );

                    const scale = Math.min(
                        canvas.width / photo.width,
                        canvas.height / photo.height
                    );

                    const width = photo.width * scale;
                    const height = photo.height * scale;
                    const x = (canvas.width - width) / 2;
                    const y = (canvas.height - height) / 2;

                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.globalCompositeOperation = "source-over";
                    ctx.drawImage(photo, x, y, width, height);

                    photo.close();
                } catch (error) {
                    alert("Could not open this image. Try a PNG or JPEG.");
                }

                photoUpload.value = "";
            });
        
        </script>

    </body>

</html>
